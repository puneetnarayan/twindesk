<!-- The sidebar's .app-mark (control.css) drawn at app-icon size: 824 px body on a 1024 canvas. -->
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../control.css">
  <style>
    html, body { margin: 0; width: 1024px; height: 1024px; background: transparent !important; overflow: hidden; }
    body { display: grid; place-items: center; }
    .app-mark { zoom: calc(824 / 34); box-shadow: inset 0 0 0 0.1px rgba(255, 255, 255, 0.35), 0 0.4px 1px rgba(0, 0, 0, 0.3); }
  </style>
</head>
<body><div class="app-mark"></div></body>
</html>
